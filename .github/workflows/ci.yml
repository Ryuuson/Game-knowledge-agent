name: Offline unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_API_KEY: offline-placeholder
      LLM_BASE_URL: http://127.0.0.1:9/v1
      LLM_MODEL: offline-test
      VISION_API_KEY: offline-placeholder
      VISION_BASE_URL: http://127.0.0.1:9/v1
      VISION_MODEL: offline-test
      RAG_BACKEND: bge
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LANGSMITH_TRACING: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Avoid torch/model downloads; Streamlit AppTest exercises the offline UI.
      - name: Install minimal test dependencies
        run: >-
          python -m pip install -r requirements-dev.txt
          langgraph==1.2.10 langgraph-checkpoint-sqlite==3.1.1
          langchain-openai==1.4.1 requests==2.34.2
          python-dotenv==1.2.2 numpy==2.2.6 streamlit==1.61.0
      - name: Verify stdlib diagnostics
        run: python -I -S scripts/doctor.py --json
      - name: Run tests with network blocked and temporary database
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import socket
          import sys
          import tempfile

          for package in ("torch", "sentence_transformers"):
              assert importlib.util.find_spec(package) is None, package

          def offline(*args, **kwargs):
              raise AssertionError("Network access is forbidden in offline unit tests")

          socket.socket.connect = offline
          socket.socket.connect_ex = offline
          socket.create_connection = offline
          with tempfile.TemporaryDirectory(prefix="game-agent-ci-") as directory:
              database = Path(directory) / "agent_memory.sqlite"
              os.environ["GAME_AGENT_DB"] = str(database)
              import pytest
              code = pytest.main(["-q", "tests"])
              agent = sys.modules.get("Agent")
              if agent is not None:
                  assert Path(agent.database_path).resolve() != Path("agent_memory.sqlite").resolve(), "Tests must not use the user's database"
              raise SystemExit(code)
          PY
